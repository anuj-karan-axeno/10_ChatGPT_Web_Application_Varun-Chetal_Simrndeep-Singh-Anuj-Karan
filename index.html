<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="./scss/main.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar__header">
                <span class="sidebar__logo">
                    <span class="sidebar__logo-text">ChatGPT</span>
                </span>

                <div class="sidebar__header-actions">

                </div>
            </div>
            <div class="sidebar__scrollable-container">

                <ul class="sidebar__compact-actions">

                </ul>

                <ul class="sidebar__list sidebar__main-action">

                </ul>

                <nav class="sidebar__nav" aria-label="Conversation history">

                </nav>

            </div>

            <footer class="sidebar__footer">

                <div class="sidebar__footer-account">
                    <div class="sidebar__footer-info">
                        <div class="sidebar__footer-avatar" aria-hidden="true"><span>A</span></div>
                        <span class="sidebar__footer-details">

                    <button class="sidebar__footer-upgrade" type="button">Upgrade</button>
                </div>

                <ul class="sidebar__footer-menu sidebar__footer-menu--hide">
                   
                </ul>

            </footer>
        </aside>
        <main class="chat">


        </main>
    </div>
    <div class="sidebar-backdrop"></div>
    <div class="search-modal-container"></div>
    <script type="module" src="./js/app.js"></script>
